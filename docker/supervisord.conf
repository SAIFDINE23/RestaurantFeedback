[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
user=root

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=999
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm-error.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=998
user=root

; ── Worker de queue : consomme les jobs asynchrones (IA, SMS, alertes temps réel) ──
; INFRA-01 : sans ce worker, les jobs ne sont jamais traités (d'où l'ancien contournement QUEUE_CONNECTION=sync).
[program:laravel-queue]
command=php /app/artisan queue:work --tries=3 --backoff=10 --max-time=3600 --sleep=3 --max-jobs=1000
directory=/app
autostart=true
autorestart=true
priority=997
user=www-data
numprocs=1
stopwaitsecs=3600
stdout_logfile=/var/log/supervisor/queue-worker.log
stderr_logfile=/var/log/supervisor/queue-worker-error.log

; ── Scheduler : exécute les tâches planifiées (reset crédits, expiration abonnements, cleanup Stripe) ──
; INFRA-01 : remplace un cron externe absent sur le conteneur Render.
[program:laravel-scheduler]
command=php /app/artisan schedule:work
directory=/app
autostart=true
autorestart=true
priority=996
user=www-data
numprocs=1
stdout_logfile=/var/log/supervisor/scheduler.log
stderr_logfile=/var/log/supervisor/scheduler-error.log

